ktor:
  application:
    modules:
      - com.meehdi.ApplicationKt.module
  deployment:
    port: ${PORT}
    host: ${HOST:0.0.0.0}

mongodb:
  uri: ${MONGODB_URI:mongodb://localhost:27017}
  database: ${MONGODB_DATABASE:notification_db}
  collection: ${MONGODB_COLLECTION:notifications}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  topic: ${KAFKA_TOPIC:todo-events}
  group-id: ${KAFKA_GROUP_ID:notification-service}
  client-id: ${KAFKA_CLIENT_ID:notification-consumer}

email:
  smtp:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    from: ${SMTP_FROM:noreply@todoapp.com}

notification:
  push:
    enabled: ${PUSH_NOTIFICATION_ENABLED:false}
    fcm-server-key: ${FCM_SERVER_KEY:}